name: Build EXE from SH
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: true
        install: mingw-w64-x86_64-gcc make
    - name: Convert SH to C and Compile
      shell: msys2 {0}
      run: |
        pacman -S --noconfirm shc
        shc -f steal.sh -o steal.exe
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: my-exe-file
        path: steal.exe
