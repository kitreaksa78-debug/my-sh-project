name: Build EXE from SH
on: [push]
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Compile SH to EXE
      run: |
        cargo install --git https://github.com/uptoamir/ShExCraft.git
        shexcraft compile_to_exe steal.sh

    - name: Upload EXE
      uses: upload-artifact@v4
      with:
        name: my-exe-file
        path: steal.exe
