name: Build EXE from SH
on: [push]
jobs:
  build:
    runs-on: windows-latest

    # កំណត់ shell លំនាំដើមសម្រាប់គ្រប់ជំហានទាំងអស់
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc make

    - name: Convert SH to C and Compile
      run: |
        pacman -S --noconfirm shc
        shc -f steal.sh -o steal.exe

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: my-exe-file
        path: steal.exe
